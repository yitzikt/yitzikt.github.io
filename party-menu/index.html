<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Menu - Order Now!</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>🎉 Party Menu 🎉</h1>
            <p class="subtitle">Order your favorites for the party!</p>
        </header>

        <div class="main-content">
            <div class="menu-section">
                <div class="category-tabs">
                    <button class="tab-btn active" data-category="all">All Items</button>
                    <button class="tab-btn" data-category="food">Food</button>
                    <button class="tab-btn" data-category="drinks">Drinks</button>
                </div>

                <div class="menu-grid" id="menuGrid">
                    <!-- Menu items will be dynamically inserted here -->
                </div>
            </div>
        </div>

        <!-- Floating Cart Button -->
        <button class="floating-cart-btn" id="floatingCartBtn">
            <span class="cart-icon">☰</span>
            <span class="cart-badge" id="floatingCartCount">0</span>
        </button>

        <!-- Cart Sidebar -->
        <div class="cart-overlay" id="cartOverlay"></div>
        <div class="cart-section" id="cartSection">
            <div class="cart-header">
                <h2>Your Order</h2>
                <button class="close-cart-btn" id="closeCartBtn">&times;</button>
            </div>
            <div class="cart-content" id="cartContent">
                <div class="cart-items" id="cartItems">
                    <p class="empty-cart">Your cart is empty</p>
                </div>
                <div class="cart-footer">
                    <button class="checkout-btn" id="checkoutBtn" disabled>Checkout</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Order Modal -->
    <div class="modal" id="orderModal">
        <div class="modal-content">
            <span class="close-modal" id="closeModal">&times;</span>
            <h2>Complete Your Order</h2>
            <form id="orderForm">
                <div class="form-group">
                    <label for="customerName">Your Name:</label>
                    <input type="text" id="customerName" name="customerName" required placeholder="Enter your name">
                </div>
                <div class="order-summary" id="orderSummary">
                    <!-- Order summary will be displayed here -->
                </div>
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancelOrder">Cancel</button>
                    <button type="submit" class="btn-primary">Submit Order</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="success-content">
                <h2>✅ Order Submitted!</h2>
                <p id="successMessage">Please note: CardKnox is having trouble processing your payment. Please contact Moshe Stein <a href="tel:18483738051">848-373-8051</a></p>
                <!-- <p id="successMessage">Your order has been sent to Discord!</p> -->
                <button class="btn-primary" id="newOrderBtn">Place New Order</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
